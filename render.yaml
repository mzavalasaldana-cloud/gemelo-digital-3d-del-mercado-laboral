databases:
  - name: labortwin-db
    databaseName: labortwin_db
    plan: free
    region: oregon

services:
  # 1. FastAPI Backend (REST API + WebSockets + ML Engine)
  - type: web
    name: gemelo-laboral-backend
    runtime: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: labortwin-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://gemelo-laboral-streamlit.onrender.com,https://gemelo-digital-3d-del-mercado-laboral.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFLOW_API_KEY
        sync: false
      - key: LANGFLOW_BASE_URL
        sync: false
      - key: LANGFLOW_COPILOT_FLOW_ID
        sync: false

  # 2. Streamlit Dashboard (Opcional en Render)
  - type: web
    name: gemelo-laboral-streamlit
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: labortwin-db
          property: connectionString
      - key: BACKEND_URL
        value: https://gemelo-laboral-backend.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFLOW_API_KEY
        sync: false
      - key: LANGFLOW_BASE_URL
        sync: false
      - key: LANGFLOW_COPILOT_FLOW_ID
        sync: false
